services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: { context: ., dockerfile: deployment/Dockerfile }
    env_file: .env
    environment: { MONGO_URI: "mongodb://mongodb:27017/gitsentinel", REDIS_HOST: redis }
    ports: ["3000:3000"]
    depends_on: [mongodb, redis]
  worker:
    build: { context: ., dockerfile: deployment/Dockerfile }
    command: ["node", "dist/workers/llm-reviewer/src/worker.js"]
    env_file: .env
    environment: { MONGO_URI: "mongodb://mongodb:27017/gitsentinel", REDIS_HOST: redis }
    depends_on: [mongodb, redis]
volumes:
  mongo_data:
